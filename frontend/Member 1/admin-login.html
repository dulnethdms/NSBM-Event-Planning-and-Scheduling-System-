<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Log In · NSBM EventHub</title>
  <meta name="description" content="Log in to the NSBM EventHub admin dashboard." />
  <link rel="stylesheet" href="css/admin-login-page.css" />
</head>
<body class="page-admin-login">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <nav class="navbar navbar--admin" aria-label="Primary navigation">
      <div class="navbar__brand">
        <a href="/Member 1/admin-login.html" class="navbar__logo">
          <span class="navbar__logo-mark" aria-hidden="true">NE</span>
          NSBM EventHub <span class="navbar__badge">Admin</span>
        </a>
      </div>
      <ul class="navbar__menu">
        <li><a href="/Member 1/login.html">Student log in</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" class="main main--admin-login">
    <!-- Admin login form -->
    <section class="auth-card auth-card--admin" aria-labelledby="admin-login-heading">
      <h1 id="admin-login-heading">Admin log in</h1>
      <p class="auth-card__intro">Access the NSBM EventHub management dashboard.</p>
      <form class="auth-form" action="#" method="post" novalidate>
        <div class="form-field">
          <label for="admin-email">Admin email address</label>
          <input type="email" id="admin-email" name="admin-email" autocomplete="email" required />
        </div>
        <div class="form-field">
          <label for="admin-password">Password</label>
          <input type="password" id="admin-password" name="admin-password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn--primary btn--block">Log in</button>
      </form>
    </section>

  </main>

    <footer class="site-footer">
      <div class="site-footer__inner">
        <div class="site-footer__brand">
          <p class="site-footer__title">NSBM EventHub</p>
          <p class="site-footer__tagline">Plan, discover and manage university events in one place.</p>
        </div>
        <nav class="site-footer__links" aria-label="Footer navigation">
          <a href="/Member 1/index.html">Home</a>
          <a href="/Member 2/events.html">Events</a>
          <a href="/Member 2/my-schedule.html">My Schedule</a>
          <a href="/Member 1/profile.html">Profile</a>
        </nav>
        <p class="site-footer__copy">&copy; 2026 NSBM Green University. All rights reserved.</p>
      </div>
    </footer>
  <script src="js/main.js" defer></script>
</body>
</html>
